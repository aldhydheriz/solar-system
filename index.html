<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar System 3D</title>
  <link rel="icon" href="data:," />
</head>
<body>
  <canvas id="solar-canvas"></canvas>

  <div id="loading-screen">
    <div class="loader-ring"></div>
    <p>Loading Solar System...</p>
  </div>

  <header id="top-bar">
    <h1>Solar System</h1>
    <div class="controls-row">
      <label for="speed-slider">Speed</label>
      <input type="range" id="speed-slider" min="0" max="200" value="50" />
      <span id="speed-label">1.0x</span>
      <button id="scale-toggle" title="Toggle real vs stylized scale">Stylized scale</button>
      <button id="labels-toggle" title="Toggle planet name labels">Labels on</button>
    </div>
  </header>

  <nav id="planet-nav"></nav>

  <aside id="info-panel" class="hidden">
    <button id="close-panel" aria-label="Close">&times;</button>
    <div id="planet-color-bar"></div>
    <h2 id="panel-name"></h2>
    <div class="panel-stats">
      <div class="stat">
        <span class="stat-label">Diameter</span>
        <span id="panel-diameter" class="stat-value"></span>
      </div>
      <div class="stat">
        <span class="stat-label">Distance from Sun</span>
        <span id="panel-distance" class="stat-value"></span>
      </div>
      <div class="stat">
        <span class="stat-label">Orbital Period</span>
        <span id="panel-period" class="stat-value"></span>
      </div>
      <div class="stat">
        <span class="stat-label">Day Length</span>
        <span id="panel-day" class="stat-value"></span>
      </div>
      <div class="stat">
        <span class="stat-label">Moons</span>
        <span id="panel-moons" class="stat-value"></span>
      </div>
    </div>
    <p id="panel-desc"></p>
  </aside>

  <div id="hint">Click a planet or moon to follow it &bull; Scroll to zoom &bull; Drag to rotate &bull; Esc to stop</div>

  <button id="follow-badge" class="hidden" title="Stop following"></button>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
